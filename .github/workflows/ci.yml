name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      torrent-url:
        description: '.torrent URL for the manual public-network quickstart leg'
        required: false
        default: 'https://releases.ubuntu.com/24.04/ubuntu-24.04.4-desktop-amd64.iso.torrent'

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install japicmp baselines (api/tracker/tools @v0.4.0)
        # 基线 jar 未发布到中央仓库，从 tag 构建安装：
        # - api 对上一个发布 tag（v0.4.0）比对（tag 自身的旧护栏跳过）
        # - tracker/tools 护栏用 file 直指仓库 jar
        #   （同版本下 dependency 坐标会被 reactor 解析成模块自身），故必须先 install。
        #   -am 连带安装 core/api 0.4.0 依赖（oldClassPath 用）
        run: |
          git fetch --depth=1 origin tag v0.4.0
          git worktree add --detach /tmp/baseline04 v0.4.0
          mvn -B -ntp -f /tmp/baseline04 -pl javathunder-api,javathunder-tracker,javathunder-tools -am install -DskipTests -DskipJapicmp=true
          git worktree remove --force /tmp/baseline04
      - name: Build and test
        # 默认传输 = NIO（生产路径）；下面两条差分腿显式跑双臂验收
        run: mvn -B -ntp verify
      - name: Differential acceptance (NIO transport, explicit)
        run: >
          mvn -B -ntp -pl javathunder-tools -am test
          -Dtest='LoopbackAcceptanceTest,MultiPeerAcceptanceTest,RateLimitAcceptanceTest,TrackerBackoffTest'
          -Djavathunder.transport=nio
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Differential acceptance (blocking reference transport)
        run: >
          mvn -B -ntp -pl javathunder-tools -am test
          -Dtest='LoopbackAcceptanceTest,MultiPeerAcceptanceTest,RateLimitAcceptanceTest,TrackerBackoffTest'
          -Djavathunder.transport=blocking
          -Dsurefire.failIfNoSpecifiedTests=false

  quickstart-public:
    # 手动触发的公网冒烟（真实 Swarm 进度事件流）：种子 URL 可输入覆盖，
    # 缺省 Ubuntu 24.04.4。不随 push/PR 跑——公网种子受网络环境影响，
    # 只作人工触发的事后验证（对齐 MANUAL §2.2）。
    name: Public quickstart (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Download torrent
        run: curl -fL --retry 3 -o /tmp/quickstart.torrent "${{ inputs.torrent-url }}"
      - name: Public quickstart smoke
        run: >
          mvn -B -ntp -pl javathunder-core -am test
          -Dtest=QuickStartTest
          -Djavathunder.quickstart.torrent=/tmp/quickstart.torrent
          -Djavathunder.quickstart.targetDir=/tmp/quickstart-data
          -Dsurefire.failIfNoSpecifiedTests=false

  interop:
    name: Interop (ttorrent referee)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Bidirectional interop
        run: >
          mvn -B -ntp -pl javathunder-tools -am test
          -Dtest=TtorrentInteropTest
          -Dsurefire.excludedGroups=
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Collect evidence on failure
        if: failure()
        run: |
          echo '--- surefire reports ---'
          cat javathunder-tools/target/surefire-reports/*.txt || true
          echo '--- last 200 lines of output ---'
          tail -200 "$GITHUB_WORKSPACE/javathunder-tools/target/surefire-reports/"*.dumpstream 2>/dev/null || true

  perf:
    name: Perf probe (regression guard)
    runs-on: ubuntu-latest
    continue-on-error: true # 探针受 runner 性能影响，先观察不阻断
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Loopback throughput probe
        run: >
          mvn -B -ntp -pl javathunder-tools -am test
          -Dtest=LoopbackThroughputProbeTest
          -Djavathunder.transport=nio
          -Dsurefire.excludedGroups=
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Extract datapoint
        if: always()
        run: grep -h "PROBE" javathunder-tools/target/surefire-reports/*.txt || true
