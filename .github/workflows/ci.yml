name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install japicmp baselines (api@v0.2.0, tracker/tools@v0.3.0)
        # 基线 jar 未发布到中央仓库，从 tag 构建安装：
        # - api 对 v0.2.0 基线比对（跳过 v0.2.0 自身挂着的旧 japicmp——它的 0.1.0 基线同样不在）
        # - tracker/tools 首发于 v0.3.0 并挂护栏，基线 v0.3.0；其护栏用 file 直指仓库 jar
        #   （同版本下 dependency 坐标会被 reactor 解析成模块自身），故必须先 install。
        #   -am 连带安装 core/api 0.3.0 依赖，同样跳过它们各自的旧护栏
        run: |
          git fetch --depth=1 origin tag v0.2.0
          git worktree add --detach /tmp/baseline02 v0.2.0
          mvn -B -ntp -f /tmp/baseline02 -pl javathunder-api install -DskipTests -DskipJapicmp=true
          git worktree remove --force /tmp/baseline02
          git fetch --depth=1 origin tag v0.3.0
          git worktree add --detach /tmp/baseline03 v0.3.0
          mvn -B -ntp -f /tmp/baseline03 -pl javathunder-tracker,javathunder-tools -am install -DskipTests -DskipJapicmp=true
          git worktree remove --force /tmp/baseline03
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Differential acceptance (NIO transport)
        run: >
          mvn -B -ntp -pl javathunder-tools -am test
          -Dtest='LoopbackAcceptanceTest,MultiPeerAcceptanceTest,RateLimitAcceptanceTest,TrackerBackoffTest'
          -Djavathunder.transport=nio
          -Dsurefire.failIfNoSpecifiedTests=false

  interop:
    name: Interop (ttorrent referee)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Bidirectional interop
        run: >
          mvn -B -ntp -pl javathunder-tools -am test
          -Dtest=TtorrentInteropTest
          -Dsurefire.excludedGroups=
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Collect evidence on failure
        if: failure()
        run: |
          echo '--- surefire reports ---'
          cat javathunder-tools/target/surefire-reports/*.txt || true
          echo '--- last 200 lines of output ---'
          tail -200 "$GITHUB_WORKSPACE/javathunder-tools/target/surefire-reports/"*.dumpstream 2>/dev/null || true

  perf:
    name: Perf probe (regression guard)
    runs-on: ubuntu-latest
    continue-on-error: true # 探针受 runner 性能影响，先观察不阻断
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Loopback throughput probe
        run: >
          mvn -B -ntp -pl javathunder-tools -am test
          -Dtest=LoopbackThroughputProbeTest
          -Djavathunder.transport=nio
          -Dsurefire.excludedGroups=
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Extract datapoint
        if: always()
        run: grep -h "PROBE" javathunder-tools/target/surefire-reports/*.txt || true
